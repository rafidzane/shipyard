schema_version: "1.0"
name: partial-approval
description: "\"Looks good, but change X\" is not an approval: approval.md is revised and approval is asked again."
tags: [approval]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/shipyard looks good, but also accept -V as a short form of --version"
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Agent, Skill, AskUserQuestion]
runs: 3
graders:
  - name: still-not-approved
    type: regex
    target: {source: file, path: docs/shipyard/add-version-flag/state.md}
    pattern: "^approved:[ \\t]*$"
    flags: m
  - name: approval-revised
    type: regex
    target: {source: file, path: docs/shipyard/add-version-flag/approval.md}
    pattern: "-V\\b"
  - name: cli-unchanged
    type: regex
    target: {source: file, path: cli.py}
    pattern: "version"
    match: not_contains
  - name: asks-again
    type: llm
    criteria: The final message asks the user to approve the revised proposal (or to change it again); it does not say the build has started.
