schema_version: "1.0"
name: merge-not-clean
description: With merge-to given up front but failed tests, the finish does not merge; it says why and asks.
tags: [finish]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/shipyard carry on"
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Agent, Skill, AskUserQuestion]
runs: 3
graders:
  - name: not-on-main
    type: file_exists
    path: ON_MAIN
    exists: false
  - name: asks-instead
    type: llm
    criteria: >-
      The final message does not report a merge into main. It says the run is not clean (the tests failed)
      so it did not merge automatically, and asks the user what to do.
