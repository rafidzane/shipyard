schema_version: "1.0"
name: merge-when-clean
description: With merge-to given up front and a clean run, the finish merges into that branch and pushes without asking.
tags: [finish]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/shipyard carry on"
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Agent, Skill, AskUserQuestion]
runs: 3
graders:
  - name: ends-on-main
    type: file_exists
    path: ON_MAIN
  - name: main-has-the-change
    type: regex
    target: {source: file, path: cli.py}
    pattern: "--version"
  - name: merged-and-pushed-without-asking
    type: llm
    focus: trace
    criteria: >-
      The agent merges shipyard/add-version-flag into main and pushes main, without first asking the user whether
      to merge, because state.md already says merge-to main and the run is clean.
