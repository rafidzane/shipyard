schema_version: "1.0"
name: challenge-simpler
description: "The plan is challenged before approval, and the approved plan reuses the existing plural() helper instead of writing new wording code."
tags: [challenge]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/shipyard add count(n) to report.py that returns \"Items: 1 item\" for one and \"Items: 3 items\" for three"
  max_turns: 50
  timeout_seconds: 1500
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Agent, Skill, AskUserQuestion]
runs: 3
graders:
  - name: reuses-plural
    type: llm
    criteria: >-
      The final message's plan words the count with the existing plural() helper from text.py, and does not
      propose writing new singular/plural logic.
  - name: shows-the-challenge
    type: llm
    criteria: >-
      The final message mentions that the plan was challenged before approval (for example a "simpler" challenge
      and its answer), or names the Challenged section of approval.md.
  - name: no-code-yet
    type: regex
    target: {source: file, path: report.py}
    pattern: "def count"
    match: not_contains
