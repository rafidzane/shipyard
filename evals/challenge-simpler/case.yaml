schema_version: "1.0"
name: challenge-simpler
description: "The plan is challenged before approval, and the approved plan reuses the existing money() helper instead of adding a new formatter."
tags: [challenge]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/shipyard add a sales tax line (8%) to receipts, shown in dollars with thousands separators"
  max_turns: 50
  timeout_seconds: 1500
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Agent, Skill, AskUserQuestion]
runs: 3
graders:
  - name: reuses-money
    type: llm
    criteria: >-
      The final message's plan formats the tax with the existing money() helper from fmt.py, and does not
      propose a new formatting function.
  - name: shows-the-challenge
    type: llm
    criteria: >-
      The final message mentions that the plan was challenged before approval (for example a "simpler" challenge
      and its answer), or names the Challenged section of approval.md.
  - name: no-code-yet
    type: regex
    target: {source: file, path: receipt.py}
    pattern: "tax"
    flags: i
    match: not_contains
