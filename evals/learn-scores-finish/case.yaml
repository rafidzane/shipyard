schema_version: "1.0"
name: learn-scores-finish
description: "At the finish, the run scores its predictions (1 caught, 1 held, 1 missed) into a scorecard row, and turns the missed problem into an incident."
tags: [learn, finish]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/shipyard carry on"
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Agent, Skill, AskUserQuestion]
runs: 3
graders:
  - name: scorecard-row
    type: regex
    target: {source: file, path: docs/shipyard/memory/scorecard.md}
    pattern: "\\|\\s*add-version-flag\\s*\\|"
  - name: scorecard-counts
    type: llm
    criteria: >-
      The final message reports the forecast as 1 caught, 1 held and 1 missed (in any order or wording).
  - name: missed-becomes-incident
    type: regex
    target: {source: file, path: docs/shipyard/memory/incidents.md}
    pattern: "I-\\d+ .*(IndexError|no arguments)"
    flags: i
