schema_version: "1.0"
name: tidy-short-approval
description: 'A tidy: run records kind tidy and a green baseline, writes the short tidy approval with evidence that the code is dead, and stops for approval before removing anything.'
tags: [tidy]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/shipyard tidy: remove the unused shout() helper from cli.py"
  max_turns: 40
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Agent, Skill, AskUserQuestion]
runs: 3
graders:
  - name: says-tidy-and-baseline
    type: llm
    criteria: >-
      The final message says this is a tidy run and states the baseline: that the tests passed before any change.
  - name: removal-with-evidence
    type: llm
    criteria: >-
      The final message lists the removal of shout() with its evidence that nothing references it.
  - name: asks-approval
    type: llm
    criteria: >-
      The final message asks the user to approve the proposal (or change it) before shout() is removed.
  - name: shout-still-there
    type: regex
    target: {source: file, path: cli.py}
    pattern: "def shout"
