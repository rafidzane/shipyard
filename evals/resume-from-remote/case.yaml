schema_version: "1.0"
name: resume-from-remote
description: A run started on another device (its branch only on the remote) is found and answered, not restarted.
tags: [resume]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/shipyard approved"
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Agent, Skill, AskUserQuestion]
runs: 3
graders:
  - name: found-the-remote-run
    type: llm
    focus: trace
    criteria: >-
      The agent finds the existing run add-version-flag on the remote branch origin/shipyard/add-version-flag,
      checks that branch out, and treats "approved" as the owner's approval of that run. It does not start
      a new run whose request is "approved".
  - name: approval-recorded
    type: regex
    target: {source: file, path: docs/shipyard/add-version-flag/state.md}
    pattern: "^approved:[ \\t]*\\S"
    flags: m
