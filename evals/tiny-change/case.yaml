schema_version: "1.0"
name: tiny-change
description: A one-line fix runs in quick mode on its own, still needs approval, and uses one builder with no parallel step.
tags: [approval, sizing]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/shipyard fix the typo \"teh\" in README.md"
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Agent, Skill, AskUserQuestion]
runs: 3
graders:
  - name: readme-not-yet-fixed
    type: regex
    target: {source: file, path: README.md}
    pattern: "\\bteh\\b"
  - name: approval-written
    type: llm
    criteria: >-
      The final message indicates a proposal (approval.md) exists for the owner to review, by any clear phrasing
      - naming the file, giving its path, saying "proposal is ready", offering it for approval, etc. The typo
      itself must not be reported as already fixed.

  - name: quick-on-its-own
    type: llm
    focus: trace
    criteria: >-
      Without a quick: prefix, the run picks quick mode because the change is small, says so, and dispatches no
      scout and no planner agent.
  - name: one-builder
    type: llm
    focus: trace
    criteria: >-
      The plan uses a single builder with no parallel builders, and the run stops to ask the user for approval before
      the typo is fixed.
